<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social card</title>
<!-- Source for assets/img/og.png (1200 x 630). Rendered with headless Chrome. -->
<style>
  @font-face { font-family: "SG"; src: url("../assets/fonts/schibsted-grotesk-normal.woff2") format("woff2"); font-weight: 400 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #fcfcfb; color: #0b1530; font-family: "SG", Arial, sans-serif; display: grid; grid-template-columns: 1fr 360px; }
  .left { padding: 64px 0 56px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  h1 { margin: 0; font-size: 150px; font-weight: 820; letter-spacing: -0.055em; line-height: 0.84; margin-left: -6px; }
  p { margin: 0; font-size: 30px; line-height: 1.25; letter-spacing: -0.01em; max-width: 620px; }
  .field { background: #1238d6; color: #fff; padding: 56px 44px; display: flex; flex-direction: column; justify-content: space-between; }
  .field strong { font-size: 34px; line-height: 1.12; letter-spacing: -0.02em; font-weight: 650; }
  .field span { font-size: 22px; opacity: 0.85; }
</style>
</head>
<body>
  <div class="left">
    <h1>Haven<br>Leno J</h1>
    <p>Full-stack developer in Chennai. Winner at Sensora 2.0, VIT Vellore.</p>
  </div>
  <div class="field">
    <strong>Looking for a software engineering internship.</strong>
    <span>havenleno22.github.io</span>
  </div>
</body>
</html>
